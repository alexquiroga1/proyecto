<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio - Configuración</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --primary-color: #1a365d; --secondary-color: #2b6cb0; --accent-color: #38b2ac; --bg-color: #f4f7f9; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); display: flex; height: 100vh; }
        .sidebar { width: 260px; background-color: var(--primary-color); color: white; display: flex; flex-direction: column; }
        .nav-links { list-style: none; padding: 0; margin-top: 15px; }
        .nav-links li { padding: 15px 25px; cursor: pointer; border-radius: 8px; margin: 5px 15px; }
        .nav-links li.active { background-color: var(--secondary-color); }
        .nav-links a { color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .config-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; max-width: 600px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        .btn-guardar { background-color: var(--secondary-color); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2 style="text-align:center; padding:20px 0; background:rgba(0,0,0,0.2);">Consultorio</h2>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="pacientes.html"><i class="fa-solid fa-users"></i> Pacientes</a></li>
            <li><a href="citas.html"><i class="fa-solid fa-calendar-check"></i> Citas</a></li>
            <li><a href="medicos.html"><i class="fa-solid fa-user-doctor"></i> Médicos</a></li>
            <li class="active"><a href="configuracion.html"><i class="fa-solid fa-gear"></i> Configuración</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <h1>Configuración del Sistema</h1>
        
        <div class="config-card">
            <h3>Datos del Consultorio</h3>
            <form id="formConfig">
                <div class="form-group"><label>Nombre del Consultorio</label><input type="text" id="confNombre" placeholder="Ej: Consultorio Central"></div>
                <div class="form-group"><label>Dirección</label><input type="text" id="confDireccion"></div>
                <div class="form-group"><label>Teléfono de Contacto</label><input type="text" id="confTelefono"></div>
                <button type="submit" class="btn-guardar">Guardar Cambios</button>
            </form>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCw1uPXzT0BVcJeN06f-BGft7WVsTRmqKs",
            authDomain: "app-gestion6.firebaseapp.com",
            projectId: "app-gestion6",
            storageBucket: "app-gestion6.firebasestorage.app",
            messagingSenderId: "136361384216",
            appId: "1:136361384216:web:2ccbda3508aa5ee579266d",
            measurementId: "G-M81VW3QSFW"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Cargar config actual de Firebase
        db.collection("configuracion").doc("general").get().then(doc => {
            if(doc.exists) {
                document.getElementById('confNombre').value = doc.data().nombre || '';
                document.getElementById('confDireccion').value = doc.data().direccion || '';
                document.getElementById('confTelefono').value = doc.data().telefono || '';
            }
        });

        // Guardar cambios en Firebase
        document.getElementById('formConfig').onsubmit = (e) => {
            e.preventDefault();
            db.collection("configuracion").doc("general").set({
                nombre: document.getElementById('confNombre').value,
                direccion: document.getElementById('confDireccion').value,
                telefono: document.getElementById('confTelefono').value
            }).then(() => {
                Swal.fire({ title: 'Configuración guardada', icon: 'success', timer: 1500 });
            });
        };
    </script>
</body>
</html>
